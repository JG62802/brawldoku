<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5AF6" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Base tile with 3D gaming border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#FACC15" stroke-width="3" filter="url(#shadow)" />
  
  <!-- 3x3 grid pattern in center representing Brawldoku -->
  <!-- Row 1 -->
  <rect x="13" y="13" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <rect x="27" y="13" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <rect x="41" y="13" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  
  <!-- Row 2 -->
  <rect x="13" y="27" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <!-- Center cell highlighted as gold star -->
  <rect x="27" y="27" width="10" height="10" rx="3" fill="url(#starGrad)" stroke="#B45309" stroke-width="1.5" />
  <path d="M32 29.5 L33.2 31.8 L35.6 32.1 L33.8 33.6 L34.3 36 L32 34.8 L29.7 36 L30.2 33.6 L28.4 32.1 L30.8 31.8 Z" fill="#78350F" />
  <rect x="41" y="27" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  
  <!-- Row 3 -->
  <rect x="13" y="41" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <rect x="27" y="41" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
  <rect x="41" y="41" width="10" height="10" rx="3" fill="#3B82F6" stroke="#1D4ED8" stroke-width="1.5" />
</svg>
